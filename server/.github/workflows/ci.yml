name: Node.js CI

on:
  pull_request:
    branches: [ main, develop ] # Run when someone opens a PR to these branches

jobs:
  test:
    runs-on: ubuntu-latest

    services: # If you need a DB for integration tests
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci # Uses package-lock.json for exact versions

      - name: Lint code
        run: npm run lint # Fails CI if Prettier/ESLint rules are broken

      - name: Run tests
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/test_db